<nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2.5 group flex-shrink-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-md shadow-indigo-200 group-hover:shadow-lg group-hover:shadow-indigo-300 transition-all duration-200">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
          </svg>
        </div>
        <span class="text-[1.05rem] font-bold tracking-tight">
          <span class="gradient-text">Insta</span><span class="text-slate-800">law.in</span>
        </span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-1">
        <a routerLink="/search"
          class="text-slate-600 hover:text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-50 transition-all duration-150">
          Find Lawyers
        </a>

        <!-- Logged in: role-based links -->
        <ng-container *ngIf="user$ | async as user">
          <a *ngIf="user.role?.roleName === 'CONSUMER_ROLE'" routerLink="/my-bookings"
            class="text-slate-600 hover:text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-50 transition-all duration-150">
            My Bookings
          </a>
          <a *ngIf="user.role?.roleName === 'PROVIDER_ROLE'" routerLink="/lawyer"
            class="text-slate-600 hover:text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-50 transition-all duration-150">
            Dashboard
          </a>
        </ng-container>

        <!-- Guest -->
        <ng-container *ngIf="!(user$ | async)">
          <div class="flex items-center gap-2 ml-3 pl-3 border-l border-slate-200">
            <a routerLink="/login"
              class="text-slate-700 hover:text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 transition-all duration-150">
              Login
            </a>
            <a routerLink="/register"
              class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-md shadow-indigo-200 hover:shadow-indigo-300 transition-all duration-200">
              Get Started
            </a>
          </div>
        </ng-container>

        <!-- Logged in: avatar + logout -->
        <ng-container *ngIf="user$ | async as user">
          <div class="flex items-center gap-2 ml-3 pl-3 border-l border-slate-200">
            <div class="flex items-center gap-2 px-3 py-1.5 bg-indigo-50 border border-indigo-100 rounded-full">
              <div class="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center flex-shrink-0">
                <span class="text-[10px] font-bold text-white leading-none">{{ user.username.charAt(0).toUpperCase() }}</span>
              </div>
              <span class="text-sm font-medium text-indigo-700 max-w-[120px] truncate">{{ user.username }}</span>
            </div>
            <button (click)="logout()"
              class="px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all duration-150">
              Logout
            </button>
          </div>
        </ng-container>
      </div>

      <!-- Mobile toggle -->
      <button (click)="toggleMenu()"
        class="md:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors">
        <svg *ngIf="!isMenuOpen" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isMenuOpen" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMenuOpen" class="md:hidden border-t border-slate-100 bg-white shadow-lg">
    <div class="px-4 py-3 space-y-1">
      <a routerLink="/search"
        class="flex items-center px-3 py-2.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors">
        Find Lawyers
      </a>

      <ng-container *ngIf="!(user$ | async)">
        <a routerLink="/login"
          class="flex items-center px-3 py-2.5 text-sm font-medium text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors">
          Login
        </a>
        <a routerLink="/register"
          class="flex items-center justify-center px-3 py-2.5 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-violet-600 rounded-xl">
          Get Started
        </a>
      </ng-container>

      <ng-container *ngIf="user$ | async as user">
        <a *ngIf="user.role?.roleName === 'CONSUMER_ROLE'" routerLink="/my-bookings"
          class="flex items-center px-3 py-2.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors">
          My Bookings
        </a>
        <a *ngIf="user.role?.roleName === 'PROVIDER_ROLE'" routerLink="/lawyer"
          class="flex items-center px-3 py-2.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors">
          Dashboard
        </a>
        <div class="flex items-center px-3 py-2 gap-2.5">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center flex-shrink-0">
            <span class="text-xs font-bold text-white">{{ user.username.charAt(0).toUpperCase() }}</span>
          </div>
          <span class="text-sm font-medium text-slate-700">{{ user.username }}</span>
        </div>
        <button (click)="logout()"
          class="w-full text-left px-3 py-2.5 text-sm font-medium text-rose-600 hover:bg-rose-50 rounded-xl transition-colors">
          Logout
        </button>
      </ng-container>
    </div>
  </div>
</nav>
